<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Votre lien de connexion</title></head>
<!-- Calandix · Magic link. À coller dans Supabase : Authentication → Emails →
     Templates → « Magic link ». Objet conseillé : Votre lien de connexion Calandix
     Le logo est servi par la landing : l'URL du site (Authentication → URL
     Configuration → Site URL) doit pointer vers sa racine. -->
<body style="margin:0;padding:0;background:#FFF8F0;font-family:'Red Hat Display',Arial,sans-serif;color:#1A0637;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF8F0;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border-radius:24px;padding:36px 32px;">
        <tr><td style="padding-bottom:28px;">
          <img src="{{ .SiteURL }}/img/calandix-logo-email.png" width="180" height="29" alt="Calandix" style="display:block;border:0;font-size:22px;font-weight:800;color:#1A0637;">
        </td></tr>
        <tr><td style="font-size:24px;font-weight:800;line-height:1.25;padding-bottom:14px;">Connexion à Calandix</td></tr>
        <tr><td style="font-size:16px;line-height:1.55;padding-bottom:28px;">Utilisez ce lien pour vous connecter. Il n’est valable qu’une fois.</td></tr>
        <tr><td style="padding-bottom:28px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#E5484D;color:#FFFFFF;text-decoration:none;font-weight:700;font-size:16px;padding:14px 26px;border-radius:999px;">Me connecter</a>
        </td></tr>
        <tr><td style="font-size:13px;line-height:1.5;color:#6B6380;">Vous n’avez rien demandé ? Ignorez cet e-mail.</td></tr>
      </table>
      <p style="font-size:12px;color:#6B6380;margin:20px 0 0;">Calandix · Le budget parfait pour célébrer</p>
    </td></tr>
  </table>
</body>
</html>
