# Les fonctions SasPay vérifient elles-mêmes l'appelant (jeton utilisateur,
# ou signature HMAC pour le webhook). Désactiver la vérification de la
# passerelle laisse passer les requêtes CORS de l'app web et les appels SasPay.
[functions.saspay-checkout]
verify_jwt = false

[functions.saspay-verify]
verify_jwt = false

[functions.saspay-payout]
verify_jwt = false

[functions.saspay-webhook]
verify_jwt = false
