<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Base href remplacée par `flutter build web --base-href` (ex. /app/ sur Netlify).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Calandix : prestataires vérifiés, invités et équipe au même endroit. Le budget parfait pour célébrer.">
  <meta name="theme-color" content="#1A0637">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Calandix">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Calandix</title>
  <link rel="manifest" href="manifest.json">

  <!-- Écran de chargement aux couleurs de Calandix : visible dès le premier
       octet, pendant que le moteur de l'app se télécharge (utile sur une
       connexion mobile lente). -->
  <style>
    html, body { margin: 0; height: 100%; background: #1A0637; }
    #splash {
      position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
      background: radial-gradient(120% 80% at 80% 0%, rgba(229, 72, 77, .35), transparent 60%),
                  radial-gradient(100% 70% at 0% 100%, rgba(98, 70, 234, .45), transparent 60%),
                  #1A0637;
      color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .45s ease, visibility .45s;
    }
    #splash.done { opacity: 0; visibility: hidden; }
    .sp-box { display: grid; justify-items: center; gap: 18px; text-align: center; }
    .sp-logo { width: 200px; height: auto; animation: sp-pop 1.6s ease-in-out infinite; }
    @keyframes sp-pop { 0%, 100% { transform: scale(1); } 45% { transform: scale(.94); } }
    .sp-bar { width: 160px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden; }
    .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #E5484D, #FFC233); animation: sp-run 1.1s ease-in-out infinite; }
    @keyframes sp-run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    .sp-text { font-size: 14px; opacity: .75; }
    @media (prefers-reduced-motion: reduce) { .sp-logo, .sp-bar i { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Chargement de Calandix">
    <div class="sp-box">
      <img class="sp-logo" src="brand/calandix-logo-light.png" width="480" height="77" alt="">
      <div class="sp-bar" aria-hidden="true"><i></i></div>
      <div class="sp-text">On prépare la fête…</div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
